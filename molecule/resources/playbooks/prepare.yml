---
# role: user
# file: molecule/resources/playbooks/prepare.yml

- name: "USER | Prepare account and access fixtures"
  hosts: all
  gather_facts: false
  tasks:
    - name: "USER | Wait for Ansible connectivity"
      ansible.builtin.wait_for_connection:
        timeout: 60

    - name: "USER | Create existing accounts with an initial password"
      become: true
      become_user: root
      ansible.builtin.user:
        name: "{{ __user_test_account }}"
        password: "{{ __user_test_password_old }}"
        create_home: true
      loop:
        - molecule_preserved
        - molecule_rotated
        - molecule_cleared
        - molecule_retired
      loop_control:
        loop_var: __user_test_account
        label: "{{ __user_test_account }}"
      no_log: true

    - name: "USER | Seed existing public keys"
      become: true
      become_user: root
      ansible.posix.authorized_key:
        user: "{{ __user_test_account }}"
        key: "{{ __user_test_key_stale }}"
      loop:
        - molecule_preserved
        - molecule_rotated
        - molecule_cleared
      loop_control:
        loop_var: __user_test_account
        label: "{{ __user_test_account }}"
