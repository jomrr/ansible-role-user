---
# role: user
# file: molecule/dev/molecule.yml

dependency:
  name: "galaxy"
  options:
    requirements-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
    role-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      allow_world_readable_tmpfiles: true
      callbacks_enabled: "ansible.builtin.default"
      callback_result_format: "yaml"
      remote_tmp: "/tmp/.ansible/tmp"
      display_ok_hosts: false
      display_skipped_hosts: false
      show_task_path_on_failure: true
    ssh_connection:
      pipelining: true
  log: true
  playbooks:
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
    prepare: "../resources/playbooks/prepare.yml"
  inventory:
    group_vars:
      all:
        __user_test_key_one: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJY2JNRcBokdKQl0i7yc6YU0sehNThbhAhEM+03aghqw molecule-user-one"
        __user_test_key_two: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID8ku4r4NhNjVsZV3v65y4XmlDD76XARoaiei/XfgbdX molecule-user-two"
        __user_test_key_stale: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKvp/aV+dZCwMZ/iutUbSx+G9sl9vzMY1/H/Lf6EHDqJ molecule-user-stale"
        __user_test_password_old: "$$6$$moleculeuser$$WrcHuMm5vTQWq3ppLqCRKaHIaOs9UWq7C.f6VKrREU9Ul2LfxMosiZlsmRCWOpo8SFwB9lSQux8wlCll5x7K7/"
        __user_test_password_new: "$$6$$moleculeuser$$lPo6a.KoxlEdFBzOgoawE4dZ6SoyDy5h6g8BUSPDnnYnwKDNc6EjJ45U3AmyK7bgEndZH9uK3vSBCo4O8w8OH/"
        user_accounts:
          - name: "molecule_new"
            home: "/srv/molecule_new"
            password: "{{ __user_test_password_new }}"
          - name: "molecule_preserved"
            password: "{{ __user_test_password_new }}"
            update_password: "on_create"
          - name: "molecule_rotated"
            password: "{{ __user_test_password_new }}"
          - name: "molecule_retired"
            state: "absent"
            remove: true
        user_authorized_keys_exclusive: true
        user_authorized_keys:
          - name: "molecule_new"
            keys:
              - "{{ __user_test_key_one }}"
          - name: "molecule_preserved"
            keys:
              - "{{ __user_test_key_one }}"
            exclusive: false
          - name: "molecule_rotated"
            keys:
              - "{{ __user_test_key_one }}"
              - "{{ __user_test_key_two }}"
          - name: "molecule_cleared"
            keys: []
verifier:
  name: "ansible"
scenario:
  test_sequence:
    - "dependency"
    - "destroy"
    - "syntax"
    - "create"
    - "prepare"
    - "converge"
    - "idempotence"
    - "check"
    - "verify"
    - "destroy"
  name: "dev"
platforms:
  - name: "almalinux-latest-user"
    image: "docker.io/jomrr/molecule-almalinux:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
  - name: "debian-latest-user"
    image: "docker.io/jomrr/molecule-debian:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
  - name: "fedora-latest-user"
    image: "docker.io/jomrr/molecule-fedora:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
  - name: "opensuse-leap-latest-user"
    image: "docker.io/jomrr/molecule-opensuse-leap:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
  - name: "opensuse-tumbleweed-latest-user"
    image: "docker.io/jomrr/molecule-opensuse-tumbleweed:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
  - name: "ubuntu-latest-user"
    image: "docker.io/jomrr/molecule-ubuntu:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
